<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BOSS | Official Telegram Community</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(135deg,#020814 0%,#07192f 50%,#020814 100%);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      color:#fff;
      overflow:hidden;
    }

    .card{
      position:relative;
      overflow:hidden;
      width:100%;
      max-width:420px;
      background:rgba(7,17,31,.95);
      border-radius:30px;
      padding:30px 22px;
      text-align:center;
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(15px);
      box-shadow:0 0 30px rgba(0,0,0,.5),0 0 80px rgba(0,140,255,.12);
    }

    .profile-glow{
      width:170px;
      height:170px;
      border-radius:50%;
      padding:5px;
      background:linear-gradient(45deg,#00d9ff,#0088cc,#00d9ff,#229ed9);
      background-size:300% 300%;
      animation:glow 5s linear infinite;
      margin:auto;
    }

    .profile-glow img{
      width:100%;
      height:100%;
      border-radius:50%;
      object-fit:cover;
      border:5px solid #07111f;
    }

    @keyframes glow{
      0%{background-position:0% 50%;}
      100%{background-position:300% 50%;}
    }

    .title{
      font-size:38px;
      font-weight:800;
      color:#00d9ff;
      margin-top:15px;
      text-shadow:0 0 15px rgba(0,217,255,.5);
    }

    .subtitle{
      font-size:16px;
      color:#d7dde5;
      margin:15px 0 25px;
      line-height:1.6;
    }

    .btn{
      display:block;
      width:100%;
      text-decoration:none;
      background:linear-gradient(90deg,#229ed9,#0088cc);
      color:#fff;
      padding:18px;
      border-radius:16px;
      font-size:20px;
      font-weight:700;
      box-shadow:0 0 25px rgba(0,136,204,.4);
    }

    .footer{
      margin-top:18px;
      font-size:14px;
      color:#4fc3ff;
    }

    /* OVERLAY */
    .overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.85);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:999;
    }

    .loader{
      width:60px;
      height:60px;
      border:5px solid #ffffff33;
      border-top:5px solid #00d9ff;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin-bottom:20px;
    }

    @keyframes spin{
      100%{transform:rotate(360deg);}
    }

    .count{
      font-size:20px;
      color:#fff;
      font-weight:600;
    }
  </style>
</head>

<body>

  <!-- Redirect Overlay -->
  <div class="overlay" id="overlay">
    <div class="loader"></div>
    <div class="count">Redirecting in <span id="timer">2</span> seconds...</div>
  </div>

  <div class="card">

    <div class="profile-glow">
      <img src="https://i.ibb.co/qMtNXHd7/Whats-App-Image-2026-03-17-at-9-44-37-PM.jpg" alt="Profile">
    </div>

    <div class="title">BOSS</div>

    <div class="subtitle">
      Join our official Telegram community for updates,
      announcements, news and educational content.
    </div>

    <a href="https://t.me/+Iho2g6_HqUkwMjc1" class="btn" target="_blank">
      🚀 JOIN TELEGRAM CHANNEL
    </a>

    <div class="footer">
      Official Community Access
    </div>

  </div>

  <script>
    let timeLeft = 2;
    const timerEl = document.getElementById("timer");

    const countdown = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        window.location.href = "https://t.me/+Iho2g6_HqUkwMjc1";
      }
    }, 1000);
  </script>

</body>
</html>
